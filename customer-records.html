<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة العملاء | Horeca Spot</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: '#212B3E', mahogany: '#77413E', rose: '#DD9C91' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #F8FAFC; }
        .sidebar-fixed { width: 280px; background-color: #212B3E; height: 100vh; position: fixed; right: 0; top: 0; z-index: 50; border-radius: 0 0 0 3.5rem; }
        .main-wrapper { margin-right: 280px; padding: 40px; }
        .premium-card { background: white; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 10px 30px rgba(33, 43, 62, 0.02); transition: 0.3s; }
        .customer-row:hover { background-color: #F9FBFF; cursor: pointer; }
        /* تحسين التباين بناءً على الملاحظات */
        .text-sub { color: #5A6A85; font-weight: 700; }
        @media (max-width: 1024px) { .sidebar-fixed { display: none; } .main-wrapper { margin-right: 0; padding: 20px; } }
    </style>
</head>
<body class="bg-[#F8FAFC]">

    <!-- السيادبار ثابت -->
    <aside class="sidebar-fixed p-8 flex flex-col shadow-2xl">
        <div class="mb-12 text-center">
            <img src="logoen.png" alt="Logo" class="h-10 mx-auto brightness-0 invert">
        </div>
        <nav class="flex-grow space-y-2">
            <a href="dashboard.html" class="flex items-center gap-4 p-4 rounded-2xl text-white/40 hover:text-rose transition-all">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="font-bold text-sm">الإحصائيات العامة</span>
            </a>
            <a href="#" class="bg-mahogany text-white flex items-center gap-4 p-4 rounded-2xl shadow-lg">
                <i data-lucide="users-round" class="w-5 h-5"></i>
                <span class="font-bold text-sm">قائمة العملاء</span>
            </a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <!-- الهيدر مع شريط البحث بالتواريخ المحدث -->
        <header class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-black text-navy">قاعدة العملاء الذكية</h1>
                <p class="text-sub text-xs mt-1 italic tracking-widest">تحليل وإدارة بيانات المشتركين</p>
            </div>
            
            <!-- عودة شريط البحث بالتواريخ بتصميم مدمج -->
            <div class="premium-card flex items-center gap-3 p-2 pr-6 rounded-full border border-gray-100">
                <div class="flex items-center gap-2">
                    <i data-lucide="search" class="w-4 h-4 text-navy/20"></i>
                    <input type="text" placeholder="ابحث باسم العميل..." class="text-xs font-bold text-navy bg-transparent outline-none w-32">
                </div>
                <div class="h-6 w-px bg-gray-100 mx-2"></div>
                <div class="flex items-center gap-2 text-[10px] font-black text-navy/40">
                    <i data-lucide="calendar" class="w-4 h-4"></i>
                    <input type="date" class="bg-transparent outline-none cursor-pointer">
                    <span>إلى</span>
                    <input type="date" class="bg-transparent outline-none cursor-pointer">
                </div>
                <button class="bg-navy text-white px-5 py-2 rounded-full font-bold text-xs hover:bg-mahogany transition-all">فلترة</button>
            </div>
        </header>

        <!-- قائمة العملاء -->
        <div class="premium-card rounded-[3rem] overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead class="bg-gray-50/50 border-b border-gray-100">
                        <tr class="text-[11px] font-black text-navy/40 uppercase tracking-widest">
                            <th class="px-8 py-5">العميل</th>
                            <th class="px-8 py-5">الفئة</th>
                            <th class="px-8 py-5">رقم الهاتف</th>
                            <th class="px-8 py-5">آخر عملية</th>
                            <th class="px-8 py-5">الإجمالي</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-50">
                        <!-- عميل 1 -->
                        <tr class="customer-row transition-all group" onclick="showCustomerDetails('مطعم بابل', 'بغداد - شارع فلسطين', '07701234567', 'صاحب مطعم', 'زبون قديم وممتاز، يفضل دقيق Le 5 Stagioni')">
                            <td class="px-8 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-navy text-white rounded-xl flex items-center justify-center font-black text-xs">MB</div>
                                    <span class="font-black text-navy text-sm">مطعم بابل</span>
                                </div>
                            </td>
                            <td class="px-8 py-4"><span class="bg-rose/10 text-rose px-3 py-1 rounded-full text-[10px] font-black">مطعم</span></td>
                            <td class="px-8 py-4 text-sub text-xs">07701234567</td>
                            <td class="px-8 py-4 text-sub text-xs italic">2026-05-12</td>
                            <td class="px-8 py-4 font-black text-navy text-sm">2,450,000</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- نافذة تفاصيل العميل (Modal) -->
    <div id="detailsModal" class="fixed inset-0 bg-navy/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-xl rounded-[3.5rem] p-8 md:p-12 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-8 left-8 text-navy/20 hover:text-mahogany transition-colors">
                <i data-lucide="x-circle" class="w-8 h-8"></i>
            </button>

            <div class="flex flex-col items-center mb-8">
                <div id="modalInitial" class="w-20 h-20 bg-mahogany text-white rounded-[2rem] flex items-center justify-center text-2xl font-black mb-4 shadow-xl shadow-mahogany/20"></div>
                <h3 id="modalName" class="text-2xl font-black text-navy"></h3>
                <span id="modalType" class="text-rose font-bold text-xs mt-1 uppercase tracking-widest"></span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                <div class="space-y-1">
                    <p class="text-[10px] font-black text-navy/20 uppercase">رقم الهاتف</p>
                    <p id="modalPhone" class="text-sm font-black text-navy"></p>
                </div>
                <div class="space-y-1">
                    <p class="text-[10px] font-black text-navy/20 uppercase">العنوان</p>
                    <p id="modalAddress" class="text-sm font-black text-navy"></p>
                </div>
                <div class="md:col-span-2 p-5 bg-gray-50 rounded-3xl">
                    <p class="text-[10px] font-black text-navy/20 uppercase mb-2">ملاحظات المدير</p>
                    <p id="modalNotes" class="text-xs font-bold text-navy leading-relaxed"></p>
                </div>
            </div>

            <div class="border-t border-gray-100 pt-8">
                <h4 class="font-black text-navy mb-4 text-sm">آخر المشتريات</h4>
                <div class="space-y-3">
                    <div class="flex justify-between items-center bg-rose/5 p-4 rounded-2xl">
                        <span class="text-xs font-bold text-navy">Le 5 Stagioni Flour (x10)</span>
                        <span class="text-xs font-black text-mahogany">850,000 IQD</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function showCustomerDetails(name, address, phone, type, notes) {
            document.getElementById('modalName').innerText = name;
            document.getElementById('modalAddress').innerText = address;
            document.getElementById('modalPhone').innerText = phone;
            document.getElementById('modalType').innerText = type;
            document.getElementById('modalNotes').innerText = notes;
            document.getElementById('modalInitial').innerText = name.substring(0, 2).toUpperCase();
            
            const modal = document.getElementById('detailsModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('detailsModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
