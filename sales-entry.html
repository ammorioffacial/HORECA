<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل مبيعات | Horeca Spot</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: '#212B3E', mahogany: '#77413E', rose: '#DD9C91' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f4f6f8; touch-action: manipulation; }
        .white-card { background: #ffffff; box-shadow: 0 15px 50px rgba(33, 43, 62, 0.05); border: 1px solid rgba(0,0,0,0.02); }
        .input-style { 
            background-color: #FFFFFF; border: 1.5px solid #E5E7EB; transition: all 0.3s ease; 
            font-size: 16px; padding: 1.25rem; border-radius: 1.25rem;
        }
        .input-style:focus { border-color: #77413E; outline: none; box-shadow: 0 0 0 4px rgba(119, 65, 62, 0.05); }
        .item-card { animation: fadeIn 0.3s ease-in-out; position: relative; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center items-start">

    <div class="white-card w-full max-w-2xl rounded-[3rem] p-6 md:p-12">
        
        <!-- الهيدر -->
        <div class="flex flex-col items-center mb-10 gap-4">
            <img src="logoen.png" alt="Horeca Spot" class="h-14 w-auto object-contain">
            <div class="text-center">
                <h2 class="text-2xl font-black text-navy">فاتورة جديدة</h2>
                <p class="text-navy/30 font-bold text-xs mt-1">نظام إدارة مبيعات هوريكا سبوت</p>
            </div>
        </div>

        <form id="salesForm" class="space-y-6">
            
            <!-- بيانات الزبون -->
            <div class="space-y-4">
                <input type="text" placeholder="اسم الزبون" class="input-style w-full font-bold text-navy" required>
                <input type="tel" placeholder="رقم الهاتف (07...)" maxlength="11" class="input-style w-full font-bold text-navy" required>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" placeholder="العنوان (اختياري)" class="input-style w-full font-bold text-navy">
                    <select class="input-style w-full font-bold text-navy cursor-pointer">
                        <option value="" disabled selected>نوع الزبون</option>
                        <option value="normal">زبون عادي</option>
                        <option value="restaurant">صاحب مطعم</option>
                        <option value="shop">صاحب محل</option>
                        <option value="coffee">صاحب كوفي</option>
                    </select>
                </div>
            </div>

            <!-- قسم المواد (تم حل مشكلة الاختفاء هنا) -->
            <div class="pt-8 mt-4 border-t border-gray-100">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-black text-navy text-lg">المواد المشتراة</h3>
                    <button type="button" onclick="addItemRow()" class="flex items-center gap-2 text-sm font-black text-mahogany bg-mahogany/5 px-4 py-2 rounded-full hover:bg-mahogany/10 transition-all">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        إضافة مادة
                    </button>
                </div>

                <div id="itemsContainer" class="space-y-4">
                    <!-- المادة الأولى -->
                    <div class="item-card bg-gray-50/50 p-5 rounded-[2rem] border border-gray-100 space-y-4">
                        <input type="text" placeholder="اسم المادة" class="item-name input-style w-full py-4 px-5 text-sm font-bold" required>
                        <div class="flex gap-3">
                            <input type="number" placeholder="السعر" oninput="calculateTotal()" class="item-price input-style flex-1 py-4 px-5 text-sm font-bold" required>
                            <input type="number" value="1" min="1" oninput="calculateTotal()" class="item-qty input-style w-24 py-4 px-5 text-sm font-bold text-center" required>
                        </div>
                    </div>
                </div>
            </div>

            <!-- الإجمالي والارسال -->
            <div class="pt-8 space-y-4">
                <div class="bg-navy p-6 rounded-[2.5rem] flex items-center justify-between shadow-xl">
                    <span class="text-rose/70 font-bold text-xs uppercase">الإجمالي الكلي</span>
                    <div class="text-left">
                        <span id="totalDisplay" class="text-3xl font-black text-white">0</span>
                        <span class="text-xs font-bold text-rose mr-1">IQD</span>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-gradient-to-r from-mahogany to-rose py-5 rounded-[2.5rem] text-white font-black text-xl flex items-center justify-center gap-3 shadow-lg shadow-mahogany/20 active:scale-95 transition-all">
                    <span>حفظ الفاتورة</span>
                    <i data-lucide="check-square" class="w-6 h-6"></i>
                </button>
            </div>
        </form>
    </div>

    <script>
        lucide.createIcons();

        function addItemRow() {
            const container = document.getElementById('itemsContainer');
            const newCard = document.createElement('div');
            newCard.className = 'item-card bg-gray-50/50 p-5 rounded-[2rem] border border-gray-100 space-y-4';
            newCard.innerHTML = `
                <!-- زر الحذف في مكان ثابت وواضح -->
                <button type="button" onclick="this.parentElement.remove(); calculateTotal();" class="absolute -top-2 -left-2 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg hover:bg-red-600 transition-all z-10">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
                <input type="text" placeholder="اسم المادة" class="item-name input-style w-full py-4 px-5 text-sm font-bold" required>
                <div class="flex gap-3">
                    <input type="number" placeholder="السعر" oninput="calculateTotal()" class="item-price input-style flex-1 py-4 px-5 text-sm font-bold" required>
                    <input type="number" value="1" min="1" oninput="calculateTotal()" class="item-qty input-style w-24 py-4 px-5 text-sm font-bold text-center" required>
                </div>
            `;
            container.appendChild(newCard);
            lucide.createIcons();
        }

        function calculateTotal() {
            let total = 0;
            document.querySelectorAll('.item-card').forEach(card => {
                const price = parseFloat(card.querySelector('.item-price').value) || 0;
                const qty = parseInt(card.querySelector('.item-qty').value) || 0;
                total += (price * qty);
            });
            document.getElementById('totalDisplay').innerText = total.toLocaleString('en-US');
        }
    </script>
</body>
</html>
